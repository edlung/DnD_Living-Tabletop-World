# LTW Player and LTW DM for iPhone and iPad (docs/adr/0070-native-apps.md §8). `xcodegen generate`
# writes LTW.xcodeproj from this file; the project is committed so Xcode opens it as is.
name: LTW
options:
  bundleIdPrefix: tech.vardahei.ltw
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: en
  createIntermediateGroups: true
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: true
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  configs:
    Debug:
      LTW_ALLOWS_LOOPBACK: 'YES'
    Release:
      LTW_ALLOWS_LOOPBACK: 'NO'
packages:
  LTWShell:
    path: LTWShell
targetTemplates:
  App:
    type: application
    platform: iOS
    dependencies:
      - package: LTWShell
        product: LTWShell
    info:
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        LSRequiresIPhoneOS: true
        LTWDefaultServer: https://ltw.vardahei.tech
        LTWAllowsLoopback: $(LTW_ALLOWS_LOOPBACK)
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: The camera scans the table’s QR code. Nothing it sees leaves the device.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchEmblem
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
targets:
  LTWPlayer:
    templates: [App]
    sources:
      - path: Player
      - path: ../native-shim/ltw-native.js
        buildPhase: resources
    info:
      path: Player/Info.plist
      properties:
        LTWAppKind: player
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Game
                UISceneDelegateClassName: LTWGameSceneDelegate
    settings:
      base:
        PRODUCT_NAME: LTWPlayer
        PRODUCT_BUNDLE_IDENTIFIER: tech.vardahei.ltw.player
  LTWDM:
    templates: [App]
    sources:
      - path: DM
      - path: ../native-shim/ltw-native.js
        buildPhase: resources
    info:
      path: DM/Info.plist
      properties:
        LTWAppKind: dm
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Game
                UISceneDelegateClassName: LTWGameSceneDelegate
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: TV
                UISceneDelegateClassName: LTWTVSceneDelegate
    settings:
      base:
        PRODUCT_NAME: LTWDM
        PRODUCT_BUNDLE_IDENTIFIER: tech.vardahei.ltw.dm
