ont-size="20">Сад Пом</text><ellipse cx="120" cy="310" rx="104" ry="48" fill="#294752" stroke="#d9b57d" stroke-width="2"/><text x="120" y="302" text-anchor="middle" fill="#f2c883" font-family="sans-serif" font-size="14">4</text><text x="120" y="328" text-anchor="middle" fill="#fff1d8" font-family="Georgia,serif" font-size="20">Библиотека</text><ellipse cx="400" cy="310" rx="104" ry="48" fill="#294752" stroke="#d9b57d" stroke-width="2"/><text x="400" y="302" text-anchor="middle" fill="#f2c883" font-family="sans-serif" font-size="14">5</text><text x="400" y="328" text-anchor="middle" fill="#fff1d8" font-family="Georgia,serif" font-size="20">Рынок</text><ellipse cx="680" cy="310" rx="104" ry="48" fill="#294752" stroke="#d9b57d" stroke-width="2"/><text x="680" y="302" text-anchor="middle" fill="#f2c883" font-family="sans-serif" font-size="14">6</text><text x="680" y="328" text-anchor="middle" fill="#fff1d8" font-family="Georgia,serif" font-size="20">Кузница</text><ellipse cx="120" cy="500" rx="104" ry="48" fill="#294752" stroke="#d9b57d" stroke-width="2"/><text x="120" y="492" text-anchor="middle" fill="#f2c883" font-family="sans-serif" font-size="14">7</text><text x="120" y="518" text-anchor="middle" fill="#fff1d8" font-family="Georgia,serif" font-size="20">Обсерватория</text><ellipse cx="400" cy="500" rx="104" ry="48" fill="#294752" stroke="#d9b57d" stroke-width="2"/><text x="400" y="492" text-anchor="middle" fill="#f2c883" font-family="sans-serif" font-size="14">8</text><text x="400" y="518" text-anchor="middle" fill="#fff1d8" font-family="Georgia,serif" font-size="20">Колокола</text><ellipse cx="680" cy="500" rx="104" ry="48" fill="#294752" stroke="#d9b57d" stroke-width="2"/><text x="680" y="492" text-anchor="middle" fill="#f2c883" font-family="sans-serif" font-size="14">9</text><text x="680" y="518" text-anchor="middle" fill="#fff1d8" font-family="Georgia,serif" font-size="20">Зимний дворец</text><ellipse cx="120" cy="690" rx="104" ry="48" fill="#294752" stroke="#d