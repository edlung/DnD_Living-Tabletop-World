f" font-size="18">Лодка «Слушай море»</text><rect x="1024" y="638" width="232" height="104" rx="24" fill="#153d56" stroke="#bda36f" stroke-width="2"/><text x="1140" y="666" text-anchor="middle" fill="#f2d799" font-family="sans-serif" font-size="16">4</text><text x="1140" y="694" text-anchor="middle" fill="#fff4df" font-family="Georgia,serif" font-size="18">Рынок Отлива</text><rect x="958.352447854375" y="882.9999999999999" width="232" height="104" rx="24" fill="#153d56" stroke="#bda36f" stroke-width="2"/><text x="1074.352447854375" y="910.9999999999999" text-anchor="middle" fill="#f2d799" font-family="sans-serif" font-size="16">5</text><text x="1074.352447854375" y="938.9999999999999" text-anchor="middle" fill="#fff4df" font-family="Georgia,serif" font-size="18">Сад Слушающих Кораллов</text><rect x="779" y="1062.352447854375" width="232" height="104" rx="24" fill="#153d56" stroke="#bda36f" stroke-width="2"/><text x="895" y="1090.352447854375" text-anchor="middle" fill="#f2d799" font-family="sans-serif" font-size="16">6</text><text x="895" y="1118.352447854375" text-anchor="middle" fill="#fff4df" font-family="Georgia,serif" font-size="18">Театр Восьми Занавесов</text><rect x="534" y="1128" width="232" height="104" rx="24" fill="#153d56" stroke="#bda36f" stroke-width="2"/><text x="650" y="1156" text-anchor="middle" fill="#f2d799" font-family="sans-serif" font-size="16">7</text><text x="650" y="1184" text-anchor="middle" fill="#fff4df" font-family="Georgia,serif" font-size="18">Стеклянный Двор</text><rect x="289.0000000000001" y="1062.352447854375" width="232" height="104" rx="24" fill="#153d56" stroke="#bda36f" stroke-width="2"/><text x="405.0000000000001" y="1090.352447854375" text-anchor="middle" fill="#f2d799" font-family="sans-serif" font-size="16">8</text><text x="405.0000000000001" y="1118.352447854375" text-anchor="middle" fill="#fff4df" font-family="Georgia,serif" font-size="18">Архив Неспешных Дел</text><rect x="109.64755214562513" y="883.0000000000002" width="232" height="104" rx="24" fill="#153d56" stroke="#bda36f" stroke-width="2"/><text x="225.64755214562513" y="911.0000000000002" text-anchor="middle" fill="#f2d799" font-family="sans-serif" font-size="16">9</text><text x="225.64755214562513" y="939.0000000000002" text-anchor="middle" fill="#fff4df" font-family="Georgia,serif" font-size="18">Первая Мастерская</text><rect x="44" y="638.0000000000001" width="232" height="104" rx="24" fill="#153d56" stroke="#bda36f" stroke-width="2"/><text x="160" y="666.0000000000001" text-anchor="middle" fill="#f2d799" font-family="sans-serif" font-size="16">10</text><text x="160" y="694.0000000000001" text-anchor="middle" fill="#fff4df" font-family="Georgia,serif" font-size="18">Зал Наутилуса</text><rect x="109.64755214562507" y="392.99999999999994" width="232" height="104" rx="24" fill="#153d56" stroke="#bda36f" stroke-width="2"/><text x="225.64755214562507" y="420.99999999999994" text-anchor="middle" fill="#f2d799" font-family="sans-serif" font-size="16">11</text><text x="225.64755214562507" y="448.99999999999994" text-anchor="middle" fill="#fff4df" font-family="Georgia,serif" font-size="18">Галерея Большой Волны</text><rect x="288.9999999999998" y="213.64755214562513" width="232" height="104" rx="24" fill="#153d56" stroke="#bda36f" stroke-width="2"/><text x="404.9999999999998" y="241.64755214562513" text-anchor="middle" fill="#f2d799" font-family="sans-serif" font-size="16">12</text><text x="404.9999999999998" y="269.6475521456251" text-anchor="middle" fill="#fff4df" font-family="Georgia,serif" font-size="18">Площадь Общего Звука</text><text x="40" y="1296" fill="#4b6070" font-family="sans-serif" font-size="18">Лодка — подвижное место. Её положение и новые открытия отмечает ведущий.</text></svg>