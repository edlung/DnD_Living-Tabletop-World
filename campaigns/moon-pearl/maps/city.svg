<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1350" role="img" aria-labelledby="title desc"><title id="title">Сухие пути Перламутра — схема ведущего</title><desc id="desc">Двенадцать мест и пятнадцать прямых связей. Пересечения линий не являются развилками.</desc><rect width="1300" height="1350" rx="24" fill="#eef5f5"/><text x="40" y="60" fill="#153d56" font-family="Georgia,serif" font-size="34">Пути под морем</text><text x="40" y="100" fill="#4b6070" font-family="sans-serif" font-size="18">Связи, не масштаб. Пересечение линий без блока — не развилка.</text><path d="M650 200L895 265.647552145625" stroke="#608897" fill="none" stroke-width="4" stroke-dasharray="10 8"/><path d="M895 265.647552145625L1074.352447854375 445" stroke="#608897" fill="none" stroke-width="4" stroke-dasharray="10 8"/><path d="M895 265.647552145625Q650 690 1140 690" stroke="#608897" fill="none" stroke-width="4" stroke-dasharray="10 8"/><path d="M1140 690L1074.352447854375 934.9999999999999" stroke="#608897" fill="none" stroke-width="4" stroke-dasharray="10 8"/><path d="M1140 690Q650 690 895 1114.352447854375" stroke="#608897" fill="none" stroke-width="4" stroke-dasharray="10 8"/><path d="M1074.352447854375 934.9999999999999L895 1114.352447854375" stroke="#608897" fill="none" stroke-width="4" stroke-dasharray="10 8"/><path d="M895 1114.352447854375L650 1180" stroke="#608897" fill="none" stroke-width="4" stroke-dasharray="10 8"/><path d="M650 1180L405.0000000000001 1114.352447854375" stroke="#608897" fill="none" stroke-width="4" stroke-dasharray="10 8"/><path d="M405.0000000000001 1114.352447854375L225.64755214562513 935.0000000000002" stroke="#608897" fill="none" stroke-width="4" stroke-dasharray="10 8"/><path d="M405.0000000000001 1114.352447854375Q650 690 160 690.0000000000001" stroke="#608897" fill="none" stroke-width="4" stroke-dasharray="10 8"/><path d="M225.64755214562513 935.0000000000002L160 690.0000000000001" stroke="#608897" fill="none" stroke-width="4" stroke-dasharray="10 