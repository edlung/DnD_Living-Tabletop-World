name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    # Pinned: Playwright system dependencies are installed for this image.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ltw
          POSTGRES_PASSWORD: ltw_ci_password
          POSTGRES_DB: ltw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ltw -d ltw"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://ltw:ltw_ci_password@127.0.0.1:5432/ltw

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Context budget
        run: pnpm run context-budget

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Migrate (bootstrap empty database)
        run: pnpm run db:migrate

      - name: Migrate again (idempotent)
        run: pnpm run db:migrate

      - name: Seed Ravenford through the World Engine
        run: pnpm run seed:ravenford

      - name: Seed again (idempotent)
        run: pnpm run seed:ravenford

      - name: Integration tests
        run: pnpm run test:integration

      - name: Install Chromium for UI journeys
        run: pnpm exec playwright install --with-deps chromium

      - name: UI and API journeys
        run: pnpm run test:e2e

  deploy:
    name: Deployment check
    # Docker Engine with BuildKit and the Compose plugin are preinstalled on this image.
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # Images of this revision, a local stack behind Caddy with internal TLS, smoke checks,
      # backup and restore drill, retention and CSP checks, the live stream through the proxy
      # (docs/adr/0037-deployment.md). The script removes everything it created.
      - name: Build, run and check the deployment
        run: bash deploy/verify/ci.sh
