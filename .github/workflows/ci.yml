name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    # Pinned: Playwright system dependencies are installed for this image.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ltw
          POSTGRES_PASSWORD: ltw_ci_password
          POSTGRES_DB: ltw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ltw -d ltw"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://ltw:ltw_ci_password@127.0.0.1:5432/ltw

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Context budget
        run: pnpm run context-budget

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Migrate (bootstrap empty database)
        run: pnpm run db:migrate

      - name: Migrate again (idempotent)
        run: pnpm run db:migrate

      - name: Seed Ravenford through the World Engine
        run: pnpm run seed:ravenford

      - name: Seed again (idempotent)
        run: pnpm run seed:ravenford

      - name: Integration tests
        run: pnpm run test:integration

      - name: Install Chromium for UI journeys
        run: pnpm exec playwright install --with-deps chromium

      - name: UI and API journeys
        run: pnpm run test:e2e

  deploy:
    name: Deployment check
    # Docker Engine with BuildKit and the Compose plugin are preinstalled on this image.
    runs-on: ubuntu-24.04
    # Two image builds without a build cache, the checks of the running stack and the browser
    # journeys (deploy/verify/ci.sh took 2.5 minutes on a workstation with a warm cache).
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # The browser journeys against the deployment run Playwright's Chromium from the
      # repository's dependencies (deploy/verify/browser-journey.sh).
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for the browser journeys
        run: pnpm exec playwright install --with-deps chromium

      # Images of this revision, the production stack (invitation sign-in) behind Caddy with
      # internal TLS, the review campaign with its curated pictures, smoke checks, the pictures
      # through the proxy, the Russian browser journeys, backup and restore drill, retention and
      # proxy contract checks, the Russian HTTP sign-in journeys and the live stream through the
      # proxy, the network trust boundary (docs/adr/0037-deployment.md). The script removes
      # everything it created.
      - name: Build, run and check the deployment
        run: bash deploy/verify/ci.sh
