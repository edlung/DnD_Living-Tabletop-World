name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Parallel jobs for wall time; `CI passed` folds them into the one check to require.
# scripts/ci-local.sh runs the same steps in sequence (its header maps them to these jobs).
jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Context budget
        run: pnpm run context-budget

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm run test

  integration:
    name: Build and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ltw
          POSTGRES_PASSWORD: ltw_ci_password
          POSTGRES_DB: ltw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ltw -d ltw"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://ltw:ltw_ci_password@127.0.0.1:5432/ltw

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Migrate (bootstrap empty database)
        run: pnpm run db:migrate

      - name: Migrate again (idempotent)
        run: pnpm run db:migrate

      - name: Seed Ravenford through the World Engine
        run: pnpm run seed:ravenford

      - name: Seed again (idempotent)
        run: pnpm run seed:ravenford

      - name: Integration tests
        run: pnpm run test:integration

  e2e:
    name: UI and API journeys (${{ matrix.shard }}/${{ strategy.job-total }})
    # Pinned: Playwright system dependencies are installed for this image.
    runs-on: ubuntu-24.04
    # A shard's third of the journeys: 5–7 of the 20 minutes the 184 took in one job (two
    # workers, 2026-10-31).
    timeout-minutes: 30

    strategy:
      # Every shard reports its own failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    env:
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The journeys import the server's test helpers, whose workspace packages resolve to dist.
      - name: Build
        run: pnpm run build

      - name: Playwright version
        id: playwright
        run: |
          version=$(pnpm exec playwright --version | awk '{print $2}')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Chromium and WebKit
        id: chromium
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Downloads the browsers only when the cache missed; their system packages and fonts
      # (Cyrillic among them) are installed on every run. WebKit runs the DM's screen on an iPad
      # (Stage 620).
      - name: Install Chromium and WebKit for UI journeys
        run: pnpm exec playwright install --with-deps chromium webkit

      # One shard saves the download as soon as it has it, whatever the journeys do.
      - name: Save Chromium and WebKit
        if: steps.chromium.outputs.cache-hit != 'true' && matrix.shard == 1
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.chromium.outputs.cache-primary-key }}

      - name: UI and API journeys
        run: pnpm run test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  deploy:
    name: Deployment check
    # Docker Engine with BuildKit and the Compose plugin are preinstalled on this image.
    runs-on: ubuntu-24.04
    # Two image builds without a build cache, the checks of the running stack and the browser
    # journeys (deploy/verify/ci.sh took 2.5 minutes on a workstation with a warm cache).
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # The browser journeys against the deployment run Playwright's Chromium from the
      # repository's dependencies (deploy/verify/browser-journey.sh).
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for the browser journeys
        run: pnpm exec playwright install --with-deps chromium

      # Images of this revision, the production stack (invitation sign-in) behind Caddy with
      # internal TLS, the review campaign with its curated pictures, smoke checks, the pictures
      # through the proxy, the Russian browser journeys, backup and restore drill, retention and
      # proxy contract checks, the Russian HTTP sign-in journeys and the live stream through the
      # proxy, the network trust boundary (docs/adr/0037-deployment.md). The script removes
      # everything it created.
      - name: Build, run and check the deployment
        run: bash deploy/verify/ci.sh

  passed:
    name: CI passed
    # The one check for branch protection. It runs whatever happened before it (a failure, a
    # skip, a cancel) and fails unless every job succeeded, since a skipped check counts as passed.
    if: always()
    needs: [static, unit, integration, e2e, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null
