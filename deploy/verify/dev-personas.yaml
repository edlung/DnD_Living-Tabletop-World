# LOCAL VERIFICATION ONLY, never on a server: the public development persona tokens
# (fixtures/ravenford/personas.json) sign anyone in. Stage 350 part A uses it to exercise the live
# stream through the real proxy before Stage 340's sign-in exists; part B replaces it with an
# invitation session and deletes this file. It pins the proxy to `localhost` with Caddy's internal
# CA, so a domain's traffic never reaches a server in this mode.
# Used through COMPOSE_FILE=compose.yaml:verify/dev-personas.yaml in a local deploy/.env.
services:
  server:
    environment:
      NODE_ENV: development
      AUTH_MODE: dev-personas
      DEV_PERSONAS_FILE: /app/fixtures/ravenford/personas.json
      LOG_LEVEL: info
  proxy:
    environment:
      PUBLIC_HOST: localhost
      TLS_MODE: internal
